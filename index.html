<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>عرّاف التراث السعودي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08281F; --bg2:#0D3A2C; --panel:#104735;
  --sand:#F4E9D6; --sand-dim:rgba(244,233,214,.55); --sand-faint:rgba(244,233,214,.14);
  --brass:#C9A227; --brass-soft:#E0C468; --green:#1E8A5C; --clay:#B0623C;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(120% 70% at 50% -10%, #14513C 0%, transparent 60%),
    linear-gradient(180deg,var(--bg) 0%, #061E17 100%);
  background-attachment:fixed;
  color:var(--sand);
  font-family:"IBM Plex Sans Arabic","Noto Kufi Arabic","Segoe UI",system-ui,sans-serif;
  display:flex;justify-content:center;
  overscroll-behavior:none;
}
#app{width:100%;max-width:580px;display:flex;flex-direction:column;height:100dvh;padding:0 16px}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:14px;padding:16px 2px 10px;flex:0 0 auto}
#pot{width:62px;height:74px;flex:0 0 auto}
.hmeta{flex:1;min-width:0}
.hmeta h1{
  font-family:"Noto Kufi Arabic",sans-serif;font-weight:800;
  font-size:20px;line-height:1.25;margin:0 0 6px;letter-spacing:-.01em
}
.bar{height:5px;background:var(--sand-faint);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--brass));
  border-radius:99px;transition:width .45s cubic-bezier(.22,1,.36,1)}
.hnums{display:flex;justify-content:space-between;font-size:12px;color:var(--sand-dim);margin-top:6px}

/* ---------- chat ---------- */
#log{flex:1 1 auto;overflow-y:auto;padding:6px 2px 12px;display:flex;flex-direction:column;gap:10px}
#log::-webkit-scrollbar{width:0}
.msg{max-width:84%;padding:13px 16px;border-radius:var(--r);line-height:1.6;font-size:16px;
  animation:rise .32s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.msg{animation:none}.bar i{transition:none}}
.ask{align-self:flex-start;background:var(--panel);border:1px solid var(--sand-faint);
  border-start-start-radius:4px;font-family:"Noto Kufi Arabic",sans-serif;font-weight:600}
.ask.big{font-size:19px;line-height:1.55}
.ans{align-self:flex-end;background:transparent;border:1px solid var(--sand-faint);
  color:var(--sand-dim);padding:8px 14px;font-size:14px;border-end-end-radius:4px}
.note{align-self:center;font-size:13px;color:var(--sand-dim);text-align:center;max-width:92%}

/* ---------- guess card ---------- */
.card{align-self:stretch;background:linear-gradient(160deg,var(--panel),#0B3327);
  border:1px solid rgba(201,162,39,.4);border-radius:18px;padding:20px;
  animation:rise .4s cubic-bezier(.22,1,.36,1) both}
.card .lead{font-size:14px;color:var(--brass-soft);margin-bottom:8px}
.card .name{font-family:"Noto Kufi Arabic",sans-serif;font-weight:800;font-size:29px;line-height:1.3}
.card .chip{display:inline-block;margin-top:12px;padding:5px 12px;border-radius:99px;
  background:rgba(201,162,39,.14);border:1px solid rgba(201,162,39,.3);
  font-size:12.5px;color:var(--brass-soft)}
.card .desc{margin-top:12px;font-size:14.5px;line-height:1.75;color:var(--sand-dim)}

.list{margin:10px 0 0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;
  border-top:1px solid var(--sand-faint);font-size:15px}
.list li span{color:var(--sand-dim);font-size:13px;font-variant-numeric:tabular-nums}

/* ---------- controls ---------- */
#controls{flex:0 0 auto;padding:10px 0 max(16px,env(safe-area-inset-bottom))}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.row.two{grid-template-columns:1fr 1fr}
button{font-family:inherit;font-size:16px;font-weight:600;color:var(--sand);
  background:var(--panel);border:1px solid var(--sand-faint);border-radius:var(--r);
  padding:16px 8px;cursor:pointer;transition:transform .1s,background .18s,border-color .18s}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button.yes{background:rgba(30,138,92,.3);border-color:rgba(30,138,92,.65)}
button.no{background:rgba(176,98,60,.26);border-color:rgba(176,98,60,.6)}
button.idk{background:rgba(201,162,39,.2);border-color:rgba(201,162,39,.5)}
button.gold{background:var(--brass);border-color:var(--brass);color:#0A2A20;font-weight:700}
button.ghost{background:transparent;color:var(--sand-dim);font-weight:500;font-size:14px;padding:11px}
.subrow{display:flex;gap:9px;margin-top:9px}
.subrow button{flex:1}

/* ---------- start ---------- */
#start{position:fixed;inset:0;background:linear-gradient(180deg,#0B3427,#061E17);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px;z-index:20;gap:6px}
#start svg{width:112px;height:134px;margin-bottom:18px}
#start h1{font-family:"Noto Kufi Arabic",sans-serif;font-weight:800;font-size:32px;margin:0;line-height:1.3}
#start p{color:var(--sand-dim);font-size:16px;line-height:1.75;max-width:330px;margin:10px 0 0}
#start .count{color:var(--brass-soft);font-size:14px;margin-top:18px}
#start button{margin-top:26px;padding:17px 50px;font-size:17px}

/* ---------- stats sheet ---------- */
#sheet{position:fixed;inset:0;background:linear-gradient(180deg,#0B3427,#061E17);z-index:25;
  overflow-y:auto;padding:26px 20px max(26px,env(safe-area-inset-bottom));display:none}
#sheet.on{display:block}
#sheet .wrap{max-width:580px;margin:0 auto}
#sheet h2{font-family:"Noto Kufi Arabic",sans-serif;font-weight:800;font-size:24px;margin:0 0 4px}
#sheet h3{font-family:"Noto Kufi Arabic",sans-serif;font-weight:600;font-size:15px;
  margin:26px 0 8px;color:var(--brass-soft)}
#sheet p.sub{color:var(--sand-dim);font-size:13px;line-height:1.7;margin:0 0 6px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
  border-top:1px solid var(--sand-faint);font-size:14.5px;line-height:1.5}
.kv b{font-weight:600;color:var(--brass-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.kv .q{min-width:0}
.kv small{display:block;color:var(--sand-dim);font-size:12px;margin-top:3px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.stat{background:var(--panel);border:1px solid var(--sand-faint);border-radius:var(--r);padding:13px}
.stat i{display:block;font-style:normal;font-size:26px;font-weight:700;color:var(--sand);
  font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--sand-dim)}
.empty{color:var(--sand-dim);font-size:13.5px;padding:10px 0}
#ask-what{margin-top:10px}
#ask-what input{width:100%;padding:14px;border-radius:var(--r);background:#0A2E24;
  border:1px solid var(--sand-faint);color:var(--sand);font-family:inherit;font-size:16px}
#ask-what input:focus{outline:2px solid var(--brass);outline-offset:1px}

/* ---------- debug ---------- */
#dbg{position:fixed;inset-block-start:0;inset-inline-end:0;width:250px;max-height:100dvh;overflow:auto;
  background:rgba(3,20,15,.96);border-inline-start:1px solid var(--sand-faint);padding:14px;
  font-size:12px;line-height:1.75;display:none;z-index:30;direction:ltr;text-align:left}
#dbg.on{display:block}
#dbg b{color:var(--brass-soft)}
</style>
</head>
<body>

<g id="pot-art">

<div id="start">
  <svg viewBox="0 0 200 240" aria-hidden="true"><use href="#pot-art"/></svg>
  <h1>عرّاف التراث السعودي</h1>
  <p>فكّر في أي شيء سعودي — أكلة، مكان، عادة، أو معلم — وسأعرفه من إجاباتك.</p>
  <div class="count" id="startCount"></div>
  <button class="gold" id="go">ابدأ اللعب</button>
</div>



<div id="app">
  <header>
    <svg id="pot" viewBox="0 0 200 240" aria-hidden="true"><use href="#pot-art"/></svg>
    <div class="hmeta">
      <h1 id="htitle">أفكّر…</h1>
      <div class="bar"><i id="fill"></i></div>
      <div class="hnums"><span id="qnum">السؤال 1</span><span id="conf">الاحتمالات: —</span></div>
    </div>
  </header>
  <div id="log" role="log" aria-live="polite"></div>
  <div id="controls"></div>
</div>

<div id="dbg"></div>
<div id="sheet"><div class="wrap" id="sheetBody"></div></div>

const N = D.items.length, Q = D.q.length;
const EPS = 0.08;
const TH = 0.88, MINQ = 5, MAXQ = 30, MAXGUESS = 4, MINGAIN = 0.01;
const REL = 0.5;   // bias toward questions the player can actually answer

/* value matrix: 1 = yes, 0 = no, 0.5 = unknown */
const M = new Float64Array(N * Q);
for (let i = 0; i < N; i++) {
  const s = D.items[i].m;
  for (let q = 0; q < Q; q++) {
    const c = s.charCodeAt(q);
    M[i * Q + q] = c === 49 ? 1 : (c === 48 ? 0 : 0.5);
  }
}
const LY = v => EPS + (1 - 2 * EPS) * v;
const LN = v => (1 - EPS) - (1 - 2 * EPS) * v;
const LI = v => 1;                 // لا أعلم is fully neutral

const W = { 1: 1, 2: 2, 3: 4 };    // how likely a visitor is to pick this item
const PRIOR = new Float64Array(N);
{ let s = 0;
  for (let i = 0; i < N; i++) { PRIOR[i] = W[D.items[i].p] || 2; s += PRIOR[i]; }
  for (let i = 0; i < N; i++) PRIOR[i] /= s; }

/* regions are not independent: Makkah implies Hijaz and rules out the rest */
const MACRO = ['reg_najd','reg_hijaz','reg_east','reg_south','reg_north'];
const PARENT = { reg_riyadh:'reg_najd', reg_qassim:'reg_najd', reg_jeddah:'reg_hijaz',
  reg_makkah:'reg_hijaz', reg_madinah:'reg_hijaz', reg_ahsa:'reg_east', reg_asir:'reg_south',
  reg_jazan:'reg_south', reg_najran:'reg_south', reg_alula:'reg_north', reg_hail:'reg_north',
  reg_tabuk:'reg_north' };
const QI = {}; D.qk.forEach((k, i) => QI[k] = i);

let P, asked, count, guesses, ruled, history, curQ, state;

/* ---------------- game history ----------------
   Anonymous. No names, no device info — just which questions were asked,
   what the player answered, and what they turned out to be thinking of. */
const IDX = {}; D.items.forEach((it, i) => IDX[it.en] = i);
const LOG = {
  key: 'saudi-akinator:v1',
  mem: [],
  ok: (() => { try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; }
               catch (e) { return false; } })(),
  load() {
    if (!this.ok) return this.mem;
    try { return JSON.parse(localStorage.getItem(this.key) || '[]'); } catch (e) { return []; }
  },
  save(rows) {
    if (rows.length > 3000) rows = rows.slice(-3000);
    if (!this.ok) { this.mem = rows; return; }
    try { localStorage.setItem(this.key, JSON.stringify(rows)); }
    catch (e) { try { localStorage.setItem(this.key, JSON.stringify(rows.slice(-1000))); } catch (e2) {} }
  },
  add(rec) {
    rec.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    rec.sent = false;
    const r = this.load(); r.push(rec); this.save(r);
    SYNC.flush();
    return rec;
  },
  pending() { return this.load().filter(r => !r.sent).length; },
  clear() { this.mem = []; if (this.ok) try { localStorage.removeItem(this.key); } catch (e) {} }
};
/* Uploads are a copy, never the original: a game is written to this device
   first, then pushed. Anything that fails stays queued and retries later, so
   a dropped connection at the booth cannot lose a round. */
const SYNC = {
  busy: false,
  async flush() {
    if (!SYNC_URL || this.busy || !navigator.onLine) return;
    this.busy = true;
    try {
      // keep draining: games finished while an upload was in flight go too
      for (let pass = 0; pass < 50; pass++) {
        const next = LOG.load().find(r => !r.sent);
        if (!next) break;
        const { sent, ...payload } = next;
        try {
          await fetch(SYNC_URL, {
            method: 'POST',
            // text/plain keeps this a "simple request" so the browser skips the
            // CORS preflight that Apps Script cannot answer
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
        } catch (e) { break; }          // offline — stop and retry next time
        const cur = LOG.load();
        const hit = cur.find(x => x.id === next.id);
        if (hit) { hit.sent = true; LOG.save(cur); }
      }
    } finally { this.busy = false; }
  }
};
addEventListener('online', () => SYNC.flush());
setTimeout(() => SYNC.flush(), 1500);   // catch up on anything left from last session

let session, t0, undos, abandoned = 0;

function reset() {
  P = PRIOR.slice();
  asked = new Uint8Array(Q);
  count = 0; guesses = 0; ruled = []; history = []; curQ = -1; state = 'ask';
  session = []; undos = 0; t0 = Date.now();
  log.innerHTML = '';
}

const log = document.getElementById('log');
const ctl = document.getElementById('controls');
const fill = document.getElementById('fill');

function norm() { let s = 0; for (let i = 0; i < N; i++) s += P[i]; for (let i = 0; i < N; i++) P[i] /= s; }
function topIdx() { let b = 0; for (let i = 1; i < N; i++) if (P[i] > P[b]) b = i; return b; }

/* expected information gain for every unasked question */
const wbuf = [new Float64Array(N), new Float64Array(N), new Float64Array(N)];
function gains() {
  let h = 0;
  for (let i = 0; i < N; i++) { const p = P[i]; if (p > 1e-12) h -= p * Math.log2(p); }
  const g = new Float64Array(Q).fill(-1e9);
  for (let q = 0; q < Q; q++) {
    if (asked[q]) continue;
    let s0 = 0, s1 = 0, s2 = 0, def = 0;
    for (let i = 0; i < N; i++) {
      const v = M[i * Q + q], p = P[i];
      const a = p * LY(v), b = p * LN(v), c = p * LI(v);
      wbuf[0][i] = a; wbuf[1][i] = b; wbuf[2][i] = c;
      s0 += a; s1 += b; s2 += c;
      if (v !== 0.5) def += p;          // share of live candidates with a definite answer
    }
    const S = [s0, s1, s2], tot = s0 + s1 + s2;
    let eh = 0;
    for (let a = 0; a < 3; a++) {
      if (S[a] < 1e-12) continue;
      const w = wbuf[a], sa = S[a];
      let e = 0;
      for (let i = 0; i < N; i++) { const p = w[i] / sa; if (p > 1e-12) e -= p * Math.log2(p); }
      eh += sa * e;
    }
    g[q] = (h - eh / tot) * ((1 - REL) + REL * def);
  }
  return g;
}

/* pick among the near-best questions so repeat visitors get different games */
/* a different opening question each game */
const OPENERS = ['edible','place','worn','object','custom','org','person','natural']
  .map(k => QI[k]).filter(q => q !== undefined);

function chooseQ(g) {
  if (count === 0) {
    const o = OPENERS.filter(q => !asked[q] && g[q] > MINGAIN);
    if (o.length) return o[Math.floor(Math.random() * o.length)];
  }
  let best = -1e9;
  for (let q = 0; q < Q; q++) if (g[q] > best) best = g[q];
  if (best < MINGAIN) return -1;
  // sample widely early so repeat visitors get a different path, tighten later
  const slack = count < 5 ? 0.75 : 0.93;
  const pool = [];
  for (let q = 0; q < Q; q++) if (g[q] >= best * slack) pool.push(q);
  return pool[Math.floor(Math.random() * pool.length)];
}

function bubble(cls, html) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.innerHTML = html;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}

function setFace(conf) {
  const m = document.querySelector('#mouth');
  if (!m) return;
  m.setAttribute('d', conf > 0.5 ? 'M86 164 Q100 178 114 164' : 'M88 168 Q100 172 112 168');
}

function header() {
  const t = topIdx(), c = P[t];
  document.getElementById('qnum').textContent = 'السؤال ' + Math.min(count + 1, MAXQ);
  let alive = 0; for (let i = 0; i < N; i++) if (P[i] > 1e-6) alive++;
  document.getElementById('conf').textContent = 'ثقة ' + Math.round(c * 100) + '٪';
  fill.style.width = Math.max(4, Math.min(100, c * 100)) + '%';
  document.getElementById('htitle').textContent =
    c > 0.5 ? 'أظن أنني عرفت…' : (count === 0 ? 'لنبدأ' : 'أفكّر…');
  setFace(c);
  if (dbgOn) renderDbg();
}

function ask() {
  const g = gains();
  const q = chooseQ(g);
  const t = topIdx();
  if (q < 0 || (P[t] > TH && count >= MINQ) || count >= MAXQ) { guess(); return; }
  curQ = q; asked[q] = 1; state = 'ask';
  const phr = (D.alt && D.alt[q] && D.alt[q].length) ? D.alt[q] : [D.q[q]];
  bubble('ask big', phr[Math.floor(Math.random() * phr.length)]);
  header(); answerButtons();
}

function answerButtons() {
  ctl.innerHTML =
    '<div class="row">' +
      '<button class="yes" data-a="0">نعم</button>' +
      '<button class="no" data-a="1">لا</button>' +
      '<button class="idk" data-a="2">لا أعلم</button>' +
    '</div>' +
    (history.length ? '<div class="subrow"><button class="ghost" id="undo">رجوع للسؤال السابق</button></div>' : '');
}

/* implied answers skip items whose value is unknown, so they are never punished */
function applyTo(q, a, implied) {
  for (let i = 0; i < N; i++) {
    const v = M[i * Q + q];
    if (implied && v === 0.5) continue;
    P[i] *= a === 0 ? LY(v) : (a === 1 ? LN(v) : LI(v));
  }
  norm(); asked[q] = 1;
}

/* resolve the rest of the geography instead of asking about it */
function implyRegions(k, a) {
  const mark = (key, ans) => {
    const q = QI[key];
    if (q === undefined || asked[q]) return;
    applyTo(q, ans, true);
  };
  if (PARENT[k]) {                       // a specific city or province
    if (a === 0) {
      mark(PARENT[k], 0);
      MACRO.forEach(m => { if (m !== PARENT[k]) mark(m, 1); });
      Object.keys(PARENT).forEach(sub => { if (sub !== k) mark(sub, 1); });
    } else if (a === 1) {
      // only rules itself out
    }
  } else if (MACRO.includes(k)) {
    if (a === 0) {
      MACRO.forEach(m => { if (m !== k) mark(m, 1); });
      Object.keys(PARENT).forEach(sub => { if (PARENT[sub] !== k) mark(sub, 1); });
    } else if (a === 1) {
      Object.keys(PARENT).forEach(sub => { if (PARENT[sub] === k) mark(sub, 1); });
    }
  }
}

function answer(a) {
  history.push({ P: P.slice(), asked: asked.slice(), count, guesses, ruled: ruled.slice(), q: curQ });
  bubble('ans', ['نعم', 'لا', 'لا أعلم'][a]);
  session.push([curQ, a]);
  applyTo(curQ, a, false);
  implyRegions(D.qk[curQ], a);
  count++;
  header();
  setTimeout(ask, 260);
}

function undo() {
  const h = history.pop(); if (!h) return;
  P = h.P; asked = h.asked; count = h.count; guesses = h.guesses; ruled = h.ruled; curQ = h.q;
  log.removeChild(log.lastChild);   // the question just asked
  log.removeChild(log.lastChild);   // the answer being taken back
  session.pop(); undos++;
  state = 'ask'; header(); answerButtons();   // re-offer the SAME question
}

function guess() {
  const t = topIdx(); const it = D.items[t]; curQ = t; state = 'guess';
  bubble('card',
    '<div class="lead">' + (guesses === 0 ? 'أعتقد أنك تفكّر في…' : 'إذن لعلّه…') + '</div>' +
    '<div class="name">' + it.ar + '</div>' +
    '<div class="chip">' + it.cat + '</div>' +
    '<div class="desc">' + it.da + '</div>');
  header();
  ctl.innerHTML =
    '<div class="row two">' +
      '<button class="yes" id="right">نعم، هذا هو</button>' +
      '<button class="no" id="wrong">لا، ليس هو</button>' +
    '</div>';
}

function record(win, target, typed) {
  LOG.add({
    t: new Date().toISOString(),
    s: Math.round((Date.now() - t0) / 1000),
    n: count, win: win, g: guesses, u: undos,
    target: target || null, typed: typed || null,
    a: session.map(([q, a]) => [D.qk[q], a])
  });
}

function won() {
  const it = D.items[curQ]; state = 'won';
  record(true, it.en, null);
  bubble('card',
    '<div class="lead">عرفتها في ' + count + ' سؤالًا</div>' +
    '<div class="name">' + it.ar + '</div>' +
    '<div class="chip">' + it.cat + '</div>' +
    '<div class="desc">' + it.da + '</div>');
  fill.style.width = '100%';
  document.getElementById('htitle').textContent = 'عرفتها!';
  ctl.innerHTML = '<div class="row two"><button class="gold" id="again">العب مرة أخرى</button>' +
    '<button class="ghost" id="again2">جولة جديدة</button></div>';
}

function wrong() {
  ruled.push(curQ);
  P[curQ] = 1e-12; norm();
  guesses++; history = [];
  if (guesses >= MAXGUESS) { lost(); return; }
  bubble('ans', 'لا');
  state = 'ask'; header(); setTimeout(ask, 260);
}

function lost() {
  state = 'lost';
  const order = Array.from({ length: N }, (_, i) => i)
    .filter(i => !ruled.includes(i))
    .sort((a, b) => P[b] - P[a]).slice(0, 5);
  bubble('card',
    '<div class="lead">استسلمت — أقرب خمسة احتمالات عندي:</div>' +
    '<ul class="list">' + order.map(i =>
      '<li>' + D.items[i].ar + '<span>' + Math.round(P[i] * 100) + '٪</span></li>').join('') +
    '</ul>');
  bubble('note', 'ساعدنا نتحسّن: ما الذي كنت تفكّر فيه؟');
  ctl.innerHTML =
    '<div id="ask-what"><input id="whatInput" type="text" autocomplete="off" ' +
      'placeholder="اكتب ما كنت تفكّر فيه…" aria-label="ما الذي كنت تفكر فيه"></div>' +
    '<div class="subrow">' +
      '<button class="gold" id="sendWhat">إرسال</button>' +
      '<button class="ghost" id="skipWhat">تخطّي</button>' +
    '</div>';
  setTimeout(() => { const el = document.getElementById('whatInput'); if (el) el.focus(); }, 60);
}

/* ---------------- reports ---------------- */
function pct(a, b) { return b ? Math.round(100 * a / b) + '٪' : '—'; }

function buildStats() {
  const rows = LOG.load();
  const done = rows.filter(r => r.win !== null);
  const wins = done.filter(r => r.win);
  const losses = done.filter(r => !r.win);
  const aband = rows.length - done.length;
  const avg = a => a.length ? (a.reduce((x, y) => x + y, 0) / a.length) : 0;

  // what visitors think of
  const think = {}; wins.forEach(r => think[r.target] = (think[r.target] || 0) + 1);
  const top = Object.entries(think).sort((a, b) => b[1] - a[1]).slice(0, 12);

  // items the game does not have yet
  const miss = {}; losses.forEach(r => { const k = (r.typed || '').trim(); if (k) miss[k] = (miss[k] || 0) + 1; });
  const missTop = Object.entries(miss).sort((a, b) => b[1] - a[1]).slice(0, 15);

  // where players and the data disagree — only measurable on games we solved
  const dis = {};
  wins.forEach(r => {
    const ti = IDX[r.target]; if (ti === undefined) return;
    r.a.forEach(([k, a]) => {
      const q = QI[k]; if (q === undefined) return;
      const d = dis[k] || (dis[k] = { asked: 0, cmp: 0, bad: 0, idk: 0, per: {} });
      d.asked++;
      if (a === 2) { d.idk++; return; }
      const v = M[ti * Q + q];
      if (v === 0.5) return;
      d.cmp++;
      if ((v === 1 ? 0 : 1) !== a) { d.bad++; d.per[r.target] = (d.per[r.target] || 0) + 1; }
    });
  });
  const label = k => { const i = QI[k]; return i === undefined ? k : D.q[i]; };
  const arName = en => (D.items[IDX[en]] || {}).ar || en;
  const mis = Object.entries(dis).filter(([, d]) => d.cmp >= 5)
    .map(([k, d]) => [k, d, d.bad / d.cmp]).sort((a, b) => b[2] - a[2]).slice(0, 10);
  const conf = Object.entries(dis).filter(([, d]) => d.asked >= 5)
    .map(([k, d]) => [k, d, d.idk / d.asked]).sort((a, b) => b[2] - a[2]).slice(0, 8);

  let h = '<h2>سجل الجولات</h2>';
  h += '<p class="sub">بيانات مجهولة تمامًا — لا أسماء ولا معلومات عن الجهاز.</p>';
  if (!LOG.ok) h += '<p class="sub" style="color:var(--clay)">تنبيه: المتصفح لا يسمح بالحفظ الدائم هنا، ' +
    'فالسجل محفوظ مؤقتًا في الذاكرة وسيضيع عند إغلاق الصفحة. صدِّر الملف قبل الإغلاق.</p>';
  h += '<div class="grid4">' +
    '<div class="stat"><i>' + done.length + '</i><span>جولة مكتملة</span></div>' +
    '<div class="stat"><i>' + pct(wins.length, done.length) + '</i><span>نسبة نجاح العرّاف</span></div>' +
    '<div class="stat"><i>' + avg(done.map(r => r.n)).toFixed(1) + '</i><span>متوسط الأسئلة</span></div>' +
    '<div class="stat"><i>' + Math.round(avg(done.map(r => r.s))) + 'ث</i><span>متوسط زمن الجولة</span></div>' +
    '</div>';
  if (aband) h += '<p class="sub" style="margin-top:8px">' + aband + ' جولة بدأت ولم تكتمل.</p>';

  const pend = LOG.load().filter(r => !r.sent).length;
  if (SYNC_URL) {
    h += '<div class="kv" style="margin-top:14px"><span class="q">الرفع إلى جوجل شيت' +
      '<small>' + (pend ? pend + ' جولة لم تُرفع بعد — ستُرفع تلقائيًا عند عودة الاتصال'
                        : 'كل الجولات مرفوعة') + '</small></span><b>' +
      (pend ? '⏳ ' + pend : '✓') + '</b></div>';
    if (pend) h += '<div class="subrow"><button id="syncNow">حاول الرفع الآن</button></div>';
  } else {
    h += '<p class="sub" style="margin-top:14px">السجل محفوظ على هذا الجهاز فقط. ' +
      'لرفعه تلقائيًا إلى جوجل شيت، ضع رابط Apps Script في SYNC_URL أعلى الملف.</p>';
  }

  h += '<h3>أسئلة يجيب عنها الزوار بعكس ما تتوقعه قاعدة البيانات</h3>';
  h += '<p class="sub">أعلى نسبة اختلاف أولًا. الاختلاف الكبير يعني أن صياغة السؤال ملتبسة أو أن تصنيف العنصر خطأ.</p>';
  h += mis.length ? mis.map(([k, d, r]) => {
      const worst = Object.entries(d.per).sort((a, b) => b[1] - a[1])[0];
      return '<div class="kv"><span class="q">' + label(k) +
        (worst ? '<small>أكثر عنصر: ' + arName(worst[0]) + ' (' + worst[1] + ')</small>' : '') +
        '</span><b>' + Math.round(r * 100) + '٪ · ' + d.bad + '/' + d.cmp + '</b></div>';
    }).join('') : '<p class="empty">تحتاج جولات أكثر (٥ مقارنات على الأقل لكل سؤال).</p>';

  h += '<h3>أسئلة تُربك الزوار</h3>';
  h += '<p class="sub">الأعلى في ضغط «لا أعلم» — غالبًا تحتاج إعادة صياغة.</p>';
  h += conf.length ? conf.map(([k, d, r]) =>
      '<div class="kv"><span class="q">' + label(k) + '</span><b>' + Math.round(r * 100) + '٪</b></div>').join('')
    : '<p class="empty">لا توجد بيانات كافية بعد.</p>';

  h += '<h3>أكثر ما يفكّر فيه الزوار</h3>';
  h += top.length ? top.map(([en, c]) =>
      '<div class="kv"><span class="q">' + arName(en) + '</span><b>' + c + '</b></div>').join('')
    : '<p class="empty">لا توجد بيانات بعد.</p>';

  h += '<h3>عناصر يطلبها الزوار وليست في القائمة</h3>';
  h += '<p class="sub">مما كتبه الزوار حين عجز العرّاف عن التخمين — هذه أفضل قائمة للإضافة.</p>';
  h += missTop.length ? missTop.map(([t, c]) =>
      '<div class="kv"><span class="q">' + t + '</span><b>' + c + '</b></div>').join('')
    : '<p class="empty">لا توجد طلبات بعد.</p>';

  h += '<div class="row" style="margin-top:26px">' +
    '<button class="gold" id="expCsv">تصدير CSV</button>' +
    '<button id="expJson">تصدير JSON</button>' +
    '<button class="ghost" id="wipe">مسح السجل</button></div>' +
    '<div class="subrow"><button class="ghost" id="closeSheet">رجوع للّعبة</button></div>';
  return h;
}

function download(name, text, type) {
  const b = new Blob(['\ufeff' + text], { type: type + ';charset=utf-8' });
  const u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(u), 1000);
}

/* one row per answer — ready to pivot in Excel */
function toCsv() {
  const rows = LOG.load();
  const out = [['game','time','seconds','questions','result','wrong_guesses','undos',
                'target_en','target_ar','typed','question_key','question_ar','answer','kb_value','agrees'].join(',')];
  const esc = v => '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"';
  rows.forEach((r, gi) => {
    const ti = r.target !== null ? IDX[r.target] : undefined;
    const res = r.win === null ? 'abandoned' : (r.win ? 'guessed' : 'gave_up');
    r.a.forEach(([k, a]) => {
      const q = QI[k];
      const v = (ti !== undefined && q !== undefined) ? M[ti * Q + q] : null;
      const kb = v === null ? '' : (v === 1 ? 'yes' : v === 0 ? 'no' : 'unknown');
      const ans = ['yes','no','dont_know'][a];
      const agrees = (v === null || v === 0.5 || a === 2) ? '' : (((v === 1 ? 0 : 1) === a) ? 'yes' : 'no');
      out.push([gi + 1, r.t, r.s, r.n, res, r.g, r.u,
                r.target || '', ti !== undefined ? D.items[ti].ar : '', r.typed || '',
                k, q !== undefined ? D.q[q] : '', ans, kb, agrees].map(esc).join(','));
    });
  });
  return out.join('\n');
}

function openSheet() {
  const el = document.getElementById('sheet');
  document.getElementById('sheetBody').innerHTML = buildStats();
  el.classList.add('on'); el.scrollTop = 0;
}

document.getElementById('sheet').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const stamp = new Date().toISOString().slice(0, 10);
  if (b.id === 'expCsv') return download('akinator-games-' + stamp + '.csv', toCsv(), 'text/csv');
  if (b.id === 'expJson') return download('akinator-games-' + stamp + '.json',
                                          JSON.stringify(LOG.load(), null, 1), 'application/json');
  if (b.id === 'wipe') {
    if (confirm('سيُحذف سجل الجولات نهائيًا. هل أنت متأكد؟')) { LOG.clear(); openSheet(); }
    return;
  }
  if (b.id === 'syncNow') { b.textContent = 'جارٍ الرفع…'; SYNC.flush().then(() => openSheet()); return; }
  if (b.id === 'closeSheet') document.getElementById('sheet').classList.remove('on');
});

/* the booth operator opens the report: press S, or tap the pot three times */
let taps = 0, tapT = 0;
document.getElementById('pot').addEventListener('click', () => {
  const now = Date.now();
  taps = (now - tapT < 700) ? taps + 1 : 1; tapT = now;
  if (taps >= 3) { taps = 0; openSheet(); }
});

function start() {
  if (session && session.length && state === 'ask') record(null, null, null);
  document.getElementById('start').style.display = 'none';
  reset(); header(); ask();
}

ctl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.a !== undefined) return answer(+b.dataset.a);
  if (b.id === 'undo') return undo();
  if (b.id === 'right') return won();
  if (b.id === 'wrong') return wrong();
  if (b.id === 'sendWhat' || b.id === 'skipWhat') {
    const el = document.getElementById('whatInput');
    const typed = b.id === 'sendWhat' && el ? el.value.trim().slice(0, 80) : '';
    record(false, null, typed);
    if (typed) bubble('note', 'شكرًا لك — سنضيفه إلى القائمة.');
    ctl.innerHTML = '<div class="row two"><button class="gold" id="again">العب مرة أخرى</button>' +
      '<button class="ghost" id="again2">جولة جديدة</button></div>';
    return;
  }
  if (b.id === 'again' || b.id === 'again2') return start();
});
document.getElementById('go').onclick = start;
document.getElementById('startCount').textContent = N + ' عنصرًا من تراث المملكة';

/* keyboard: 1 = نعم, 2 = لا, 3 = لا أعلم, Backspace = رجوع */
addEventListener('keydown', e => {
  if (e.key === 's' || e.key === 'S') { openSheet(); return; }
  if (e.key === 'd') { dbgOn = !dbgOn; document.getElementById('dbg').classList.toggle('on', dbgOn); renderDbg(); return; }
  if (state !== 'ask') return;
  if (e.key === '1') answer(0); else if (e.key === '2') answer(1);
  else if (e.key === '3') answer(2); else if (e.key === 'Backspace') undo();
});

/* operator panel — press D */
let dbgOn = false;
function renderDbg() {
  const el = document.getElementById('dbg'); if (!dbgOn) return;
  const idx = Array.from({ length: N }, (_, i) => i).sort((a, b) => P[b] - P[a]).slice(0, 12);
  let alive = 0; for (let i = 0; i < N; i++) if (P[i] > 1e-6) alive++;
  el.innerHTML = '<b>questions asked</b> ' + count + '<br><b>live candidates</b> ' + alive + ' / ' + N +
    '<br><b>wrong guesses</b> ' + guesses + '<hr style="border-color:rgba(244,233,214,.14)">' +
    idx.map(i => (P[i] * 100).toFixed(1).padStart(5) + '% &nbsp;' + D.items[i].en).join('<br>');
}
</script>
